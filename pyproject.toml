[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "godot-store-mcp"
version = "0.1.0"
description = "MCP server for the Godot asset library (godotengine.org/asset-library) and the new Godot Asset Store (store.godotengine.org)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Jake Cattrall" }]
maintainers = [{ name = "NodotProject" }]
keywords = ["mcp", "godot", "asset-library", "asset-store", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp[cli]>=1.9.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "platformdirs>=4.2",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Required only if you want `store_login_browser` (Playwright-driven Chromium
# fallback for captcha / 2FA flows). After installing this extra, also run:
#   python -m playwright install chromium
browser = ["playwright>=1.40"]

[project.scripts]
godot-store-mcp = "godot_store_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/NodotProject/godot-store-mcp"
Issues = "https://github.com/NodotProject/godot-store-mcp/issues"
Repository = "https://github.com/NodotProject/godot-store-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/godot_store_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/godot_store_mcp", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
